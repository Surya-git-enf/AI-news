<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title> Sign Up / Sign In </title>
<style>
:root {
  --white: #FFFFFF;
  --beige: #F5F5DC;
  --black: #000000;
  --white-translucent: rgba(255, 255, 255, 0.9);
  --white-semi-transparent: rgba(255, 255, 255, 0.2);
  --black-translucent: rgba(0, 0, 0, 0.5);
  --black-semi-transparent: rgba(0, 0, 0, 0.2);
}
body{margin:0;font-family:'Charter', serif;height:100vh;background:linear-gradient(135deg, var(--white), var(--beige));display:flex;justify-content:center;align-items:center;overflow:hidden;transition:opacity .8s ease}
.fade-out{opacity:0}
/* keep original glass card look */
.auth-container{width:250px;background:var(--white-semi-transparent);backdrop-filter:blur(10px);border-radius:20px;box-shadow:0 0 25px var(--white-translucent);padding:30px;text-align:center;position:relative;overflow:hidden;animation:fadeIn 420ms ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.995)}to{opacity:1;transform:scale(1)}}

.auth-container h2{font-family:'GT Super', sans-serif;color:var(--black);margin-bottom:20px;text-shadow:0 0 10px rgba(0,0,0,0.1)}
input{width:80%;padding:12px;margin:8px 0;border:none;border-radius:25px;outline:none;text-align:center;font-size:16px;box-shadow:0 0 5px rgba(0,0,0,0.1);background:var(--white-translucent)}
button{width:85%;padding:12px;margin-top:10px;border:none;border-radius:25px;font-size:17px;font-weight:700;color:var(--white);cursor:pointer;background:linear-gradient(90deg,var(--beige), #D4AF37);box-shadow:0 0 15px rgba(0,0,0,0.2);transition:all .25s}
button:hover{transform:scale(1.04);box-shadow:0 0 25px rgba(0,0,0,0.2)}
.switch{margin-top:18px;color:var(--black);font-size:14px;cursor:pointer}
.loading{border:4px solid rgba(0,0,0,0.1);border-top:4px solid var(--black);border-radius:50%;width:25px;height:25px;margin:12px auto;animation:spin 1s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);background:linear-gradient(135deg,var(--beige), #D4AF37);color:var(--black);border-radius:16px;padding:18px 22px;box-shadow:0 0 30px rgba(0,0,0,0.2);text-align:center;opacity:0;pointer-events:none;transition:all .28s}
.popup.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.popup.error{background:linear-gradient(135deg,#ff5252,#ff1744)}

/* transition: outgoing = slide left + fade + zoom-out */
.slide-out{animation:slideOut .36s forwards}
@keyframes slideOut{from{transform:translateX(0) scale(1);opacity:1}to{transform:translateX(-28%) scale(.92);opacity:0}}

/* incoming = slide from right + fade + zoom-in */
.slide-in{animation:slideIn .42s forwards}
@keyframes slideIn{from{transform:translateX(30%) scale(.96);opacity:0}60%{transform:translateX(-4%) scale(1.02);opacity:1}to{transform:translateX(0) scale(1);opacity:1}}

@media (max-width:420px){ .auth-container{width:92vw;padding:22px} input{width:90%} button{width:90%} }
</style>
</head>
<body>
  <div class="auth-container" id="authBox" aria-live="polite">
    <h2 id="formTitle">Sign Up</h2>
    <div id="formContent">
      <input id="email" type="email" placeholder="Enter your email" autocomplete="email" />
      <input id="password" type="password" placeholder="Enter password (min 6 chars)" autocomplete="current-password" />
      <div class="loading" id="loading" aria-hidden="true"></div>
      <button id="authBtn" type="button">Sign Up</button>
      <div class="switch" id="switchText">Already have an account? Sign In</div>
    </div>
  </div>

  <div class="popup" id="popup"><h3 id="popupTitle"></h3><p id="popupMsg"></p></div>

<script type="module">
/*
  Resilient auth UI:
  - Tries dynamic import of Supabase when DB actions are needed.
  - If import or network fails, uses a localStorage-based fallback "users" store so UI works offline.
  - Ensures event listeners are attached after DOM content loaded.
*/

// Supabase credentials - should be set via environment variables in production
// Example: const SUPABASE_URL = process.env.SUPABASE_URL || '';
//          const SUPABASE_ANON_KEY = process.env.SUPABASE_ANON_KEY || '';
const SUPABASE_URL = '{{SUPABASE_URL}}';
const SUPABASE_ANON_KEY = '{{SUPABASE_ANON_KEY}}';

console.log('[auth] module loaded');

function dbg(...args){ console.log('[auth]', ...args); }

document.addEventListener('DOMContentLoaded', () => {
  // UI refs
  const formContent = document.getElementById('formContent');
  const formTitle = document.getElementById('formTitle');
  const emailEl = document.getElementById('email');
  const passEl  = document.getElementById('password');
  const authBtn  = document.getElementById('authBtn');
  const switchText = document.getElementById('switchText');
  const loadingEl = document.getElementById('loading');
  const popup = document.getElementById('popup');
  const popupTitle = document.getElementById('popupTitle');
  const popupMsg = document.getElementById('popupMsg');

  let isSignUp = true;
  let supabaseClient = null;
  let triedSupabase = false;

  // --- Redirect early if userEmail present
  try {
    const saved = localStorage.getItem('userEmail');
    dbg('init saved email:', saved);
    if (saved && saved.trim() !== '') {
      document.body.classList.add('fade-out');
      setTimeout(()=> window.location.href = `news.html?email=${encodeURIComponent(saved.trim())}`, 820);
      return; // stop further UI init
    }
  } catch(e){ dbg('init exception', e); }

  // --- helpers: UI
  function setLoading(on){
    loadingEl.style.display = on ? 'block' : 'none';
    authBtn.disabled = on;
    switchText.style.pointerEvents = on ? 'none' : 'auto';
  }

  function showPopup(type='info', title='', msg=''){
    popup.className = 'popup' + (type === 'error' ? ' error' : '');
    popupTitle.innerText = title;
    popupMsg.innerText = msg;
    popup.classList.add('show');
    setTimeout(()=> popup.classList.remove('show'), 2800);
  }

  // --- Fallback local "DB" using localStorage
  function _getMockUsers(){
    try {
      const raw = localStorage.getItem('mock_users');
      return raw ? JSON.parse(raw) : [];
    } catch(e){ return []; }
  }
  function _saveMockUsers(list){
    try { localStorage.setItem('mock_users', JSON.stringify(list)); } catch(e){}
  }
  async function mockEmailExists(email){
    const list = _getMockUsers();
    return list.some(u => u.email === email);
  }
  async function mockCreateUser(email){
    const list = _getMockUsers();
    if (list.some(u => u.email === email)) return { success:false, alreadyExists:true };
    const row = { id: Date.now(), email, created_at: new Date().toISOString() };
    list.push(row);
    _saveMockUsers(list);
    return { success:true, data: row };
  }

  // --- attempt dynamic import of supabase (only when first DB op needed)
  async function ensureSupabase(){
    if (triedSupabase) return supabaseClient;
    triedSupabase = true;
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON-KEY')) {
      dbg('Supabase config missing or placeholder — skipping remote DB init');
      return null;
    }
    try {
      dbg('attempting dynamic import of @supabase/supabase-js');
      const module = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
      supabaseClient = module.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
      dbg('supabase client created');
      return supabaseClient;
    } catch (e) {
      dbg('dynamic import failed or network blocked', e);
      return null;
    }
  }

  // --- DB helpers (use supabase if available, otherwise fallback)
  async function emailExists(email){
    const client = await ensureSupabase();
    if (client) {
      try {
        const { data, error } = await client.from('users').select('id,email').eq('email', email).maybeSingle();
        if (error) {
          dbg('supabase emailExists error', error);
          return null; // treat as indeterminate to show popup
        }
        return !!data;
      } catch (e){
        dbg('supabase emailExists exception', e);
        return null;
      }
    } else {
      // fallback
      return await mockEmailExists(email);
    }
  }

  async function createUserRow(email){
    const client = await ensureSupabase();
    if (client) {
      try {
        const { data, error } = await client.from('users').insert({ email, created_at: new Date().toISOString() }).select().single();
        if (error) {
          dbg('supabase createUserRow error', error);
          // map some common errors
          const m = (error.message||'').toLowerCase();
          if (m.includes('permission') || m.includes('rls')) {
            return { success:false, blocked:true, error };
          }
          if (m.includes('duplicate') || (error.code === '23505')) {
            return { success:false, alreadyExists:true, error };
          }
          return { success:false, error };
        }
        return { success:true, data };
      } catch (e){
        dbg('supabase createUserRow exception', e);
        return { success:false, error:e };
      }
    } else {
      // fallback
      return await mockCreateUser(email);
    }
  }

  // --- Main click handler (same logic)
  authBtn.addEventListener('click', async () => {
    const email = (emailEl.value||'').trim().toLowerCase();
    const password = (passEl.value||'').trim();

    if (!email || !password) { showPopup('error','Missing fields','Please enter email and password'); return; }
    setLoading(true);

    if (isSignUp) {
      const exists = await emailExists(email);
      if (exists === null) { setLoading(false); showPopup('error','DB error','Could not verify email — check console.'); return; }
      if (exists) { setLoading(false); showPopup('error','Account exists','This email is already registered. Switch to Sign In to continue.'); return; }

      const created = await createUserRow(email);
      setLoading(false);
      if (created.success) {
        localStorage.setItem('userEmail', email);
        showPopup('success','Account created', `Welcome ${email.split('@')[0]}!`);
        setTimeout(()=> { document.body.classList.add('fade-out'); setTimeout(()=> window.location.href = `news.html?email=${encodeURIComponent(email)}`, 700); }, 900);
      } else {
        dbg('createUserRow failed', created);
        if (created.alreadyExists) showPopup('error','Already exists','Account created recently — try Sign In.');
        else if (created.blocked) showPopup('error','DB blocked','Client write blocked (check policies).');
        else showPopup('error','Insert failed','Could not create account (see console).');
      }
    } else {
      const exists = await emailExists(email);
      setLoading(false);
      if (exists === null) { showPopup('error','DB error','Could not verify email — check console.'); return; }
      if (!exists) { showPopup('error','Not found','Account not found — please sign up first.'); return; }
      localStorage.setItem('userEmail', email);
      showPopup('success','Welcome back','Signing you in…');
      setTimeout(()=> { document.body.classList.add('fade-out'); setTimeout(()=> window.location.href = `news.html?email=${encodeURIComponent(email)}`, 700); }, 900);
    }
  });

  // toggle UI
  switchText.addEventListener('click', () => {
    formContent.classList.add('slide-out');
    setTimeout(()=> {
      formContent.classList.remove('slide-out');
      isSignUp = !isSignUp;
      formTitle.innerText = isSignUp ? 'Sign Up' : 'Sign In';
      authBtn.innerText = isSignUp ? 'Sign Up' : 'Sign In';
      switchText.innerText = isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Sign Up";
      passEl.value = '';
      formContent.classList.add('slide-in');
      setTimeout(()=> formContent.classList.remove('slide-in'), 460);
    }, 260);
  });

  passEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') authBtn.click(); });

  // Done
  dbg('UI initialized — buttons active');
});
</script>
</body>
</html>
