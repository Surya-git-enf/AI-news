<!-- /mnt/data/index.html
     Full auth page: Email/Password sign up & sign in + Google OAuth (supabase-js v2)
     Replace nothing — this already contains your SUPABASE_URL and SUPABASE_ANON_KEY from before.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up / Sign In — Supabase + Google</title>
  <style>
    :root { --bg1:#071029; --glass: rgba(255,255,255,0.03); --accent:#ff914d; }
    html,body{height:100%;margin:0;font-family:Poppins,Inter,system-ui,-apple-system,"Segoe UI",Roboto;background:linear-gradient(135deg,#06203a,#081028);color:#e6eef8;display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{width:100%;max-width:720px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:12px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,0.6);}
    h1{margin:0 0 8px 0;font-size:20px}
    p.small{margin:0 0 14px 0;color:#a9b6cc;font-size:13px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    input{flex:1;padding:12px 14px;border-radius:10px;border:none;background:var(--glass);color:#e6eef8;min-width:180px}
    button{padding:10px 14px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(90deg,#ff914d,#ffb84d);color:#041025;font-weight:700}
    .muted{color:#98a9c2;font-size:13px;cursor:pointer;text-decoration:underline}
    .hidden{display:none!important}
    .popup{position:fixed;left:50%;top:12%;transform:translateX(-50%);background:rgba(0,0,0,0.65);padding:10px 14px;border-radius:10px;color:white;display:none;z-index:40}
    .popup.show{display:block}
    .dashboard{margin-top:12px;padding:14px;background:rgba(255,255,255,0.02);border-radius:10px;color:#cfe7ff}
    pre{background:rgba(0,0,0,0.25);padding:12px;border-radius:8px;overflow:auto;color:#e6eef8}
    .oauthBtn{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#fff;cursor:pointer}
    .oauthIcon{width:20px;height:20px}
    .right{display:flex;gap:10px;align-items:center}
    @media (max-width:520px){.row{flex-direction:column}.right{justify-content:center}}
  </style>
</head>
<body>
  <div class="card">
    <!-- AUTH FORM -->
    <div id="authSection">
      <h1 id="formTitle">Sign Up</h1>
      <p class="small" id="formSub">Create an account or sign in if you already have one. You can also use Google.</p>

      <div class="row">
        <input id="email" type="email" placeholder="Email (you@example.com)" autocomplete="email" />
        <input id="password" type="password" placeholder="Password (min 6 chars)" autocomplete="current-password" />
      </div>

      <div class="row" style="justify-content:space-between;align-items:center;">
        <div>
          <div id="loadingText" style="display:none;">Processing…</div>
        </div>
        <div class="right">
          <button id="authBtn">Sign Up</button>
        </div>
      </div>

      <div style="margin-top:12px; display:flex; gap:12px; align-items:center;">
        <span id="switchText" class="muted">Already have an account? Sign In</span>
        <button id="googleBtn" class="oauthBtn" title="Sign in with Google">
          <svg class="oauthIcon" viewBox="0 0 533.5 544.3" xmlns="http://www.w3.org/2000/svg"><path fill="#4285f4" d="M533.5 278.4c0-18.1-1.6-36.1-4.7-53.4H272.1v101.1h146.7c-6.3 34-25 62.8-53.6 82.1v68.3h86.4c50.6-46.7 81.9-115.4 81.9-198.1z"/><path fill="#34a853" d="M272.1 544.3c72.4 0 133.3-24.1 177.7-65.2l-86.4-68.3c-24.1 16.6-55 26.4-91.3 26.4-70.2 0-129.7-47.2-151-110.9H33.1v69.5C77.1 478.6 168 544.3 272.1 544.3z"/><path fill="#fbbc04" d="M121.1 328.9c-8.4-24.3-8.4-50.6 0-74.9V184.5H33.1c-42.8 85.5-42.8 186.2 0 271.7l88-69.3z"/><path fill="#ea4335" d="M272.1 108.1c39.3-.6 76.5 14.5 105 40.2l78.8-78.8C405.4 24.5 344 0 272.1 0 168 0 77.1 65.7 33.1 184.5l88 69.5c21.2-63.8 80.8-110.9 151-110.9z"/></svg>
          Continue with Google
        </button>
      </div>
    </div>

    <!-- DASHBOARD (shown after sign in) -->
    <div id="dashSection" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h1 id="welcomeTitle">Welcome</h1>
          <p class="small" id="welcomeSub">You're signed in — your account info is below.</p>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="signOutBtn">Sign Out</button>
        </div>
      </div>

      <div class="dashboard">
        <p class="small"><strong>Signed-in email:</strong> <span id="emailText"></span></p>
        <p class="small"><strong>DB record (public.users):</strong></p>
        <pre id="userRow">Loading user row...</pre>
      </div>
    </div>

    <div id="popup" class="popup"></div>
  </div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  // ---------- CONFIG: your project values (already provided earlier) ----------
  const SUPABASE_URL = 'https://cmsyrrnekokiqeonfqdo.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtc3lycm5la29raXFlb25mcWRvIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1ODE3MDgyOCwiZXhwIjoyMDczNzQ2ODI4fQ.0bOFoi7JXEtRlHNU-Am60_4peN6IkV_A3kRa7ibAr8w';
  // -------------------------------------------------------------------------

  // create supabase client (if you already create one elsewhere, you can reuse it)
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // UI refs
  const authSection = document.getElementById('authSection');
  const dashSection = document.getElementById('dashSection');
  const authBtn = document.getElementById('authBtn');
  const switchText = document.getElementById('switchText');
  const formTitle = document.getElementById('formTitle');
  const formSub = document.getElementById('formSub');
  const loadingText = document.getElementById('loadingText');
  const popup = document.getElementById('popup');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  const emailText = document.getElementById('emailText');
  const userRowPre = document.getElementById('userRow');
  const welcomeTitle = document.getElementById('welcomeTitle');
  const signOutBtn = document.getElementById('signOutBtn');
  const googleBtn = document.getElementById('googleBtn');

  // local path (where this file is stored)
  const LOCAL_FILE_PATH = '/mnt/data/index.html';

  // state
  let isSignUp = true;

  // small helpers
  function showPopup(msg, ms = 2400) {
    popup.innerText = msg;
    popup.classList.add('show');
    setTimeout(()=> popup.classList.remove('show'), ms);
  }
  function setLoading(on) {
    loadingText.style.display = on ? 'inline-block' : 'none';
    authBtn.disabled = on;
    googleBtn.disabled = on;
  }

  // Toggle between sign up & sign in
  switchText.addEventListener('click', () => {
    isSignUp = !isSignUp;
    formTitle.innerText = isSignUp ? 'Sign Up' : 'Sign In';
    formSub.innerText = isSignUp ? 'Create an account or sign in if you already have one.' : 'Sign in with your email and password.';
    authBtn.innerText = isSignUp ? 'Sign Up' : 'Sign In';
    switchText.innerText = isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Sign Up";
  });

  // Main handler
  authBtn.addEventListener('click', handleAuth);

  async function handleAuth() {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    if (!email || !password) {
      showPopup('Please enter email and password');
      return;
    }
    setLoading(true);
    try {
      if (isSignUp) {
        // sign up
        const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });
        if (signUpError) {
          console.warn('signUpError', signUpError);
          // if account already exists, try sign in automatically
          if (/already/i.test(signUpError.message || '')) {
            const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({ email, password });
            if (signInError) {
              console.error('Sign in fallback failed', signInError);
              showPopup('Sign in failed: ' + (signInError.message || 'see console'));
            } else {
              localStorage.setItem('userEmail', email);
              showPopup('Signed in — welcome back!');
              await loadDashboard();
            }
          } else {
            showPopup('Sign up failed: ' + (signUpError.message || 'see console'));
          }
        } else {
          // signUp succeeded (might require email confirmation depending on project settings)
          // Try to upsert into public.users (will succeed if RLS/policies allow; trigger may have already inserted)
          const userId = signUpData?.user?.id ?? null;
          try {
            const payload = { id: userId, email, created_at: new Date().toISOString() };
            const { data, error } = await supabase.from('users').upsert([payload], { returning: 'minimal' });
            if (error) {
              console.warn('Upsert warning after signUp', error);
            } else {
              console.log('Upsert after signUp result', data);
            }
          } catch (err) {
            console.error('Upsert exception after signUp', err);
          }
          localStorage.setItem('userEmail', email);
          showPopup('Account created! If confirmation required, check your email.');
          // if signUpData.user exists (instant session), load dashboard
          if (signUpData?.user) await loadDashboard();
        }
      } else {
        // sign in
        const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({ email, password });
        if (signInError) {
          console.error('signInError', signInError);
          showPopup('Sign in failed: ' + (signInError.message || 'see console'));
        } else {
          // ensure DB row exists
          const userId = signInData?.user?.id ?? null;
          try {
            const payload = { id: userId, email, created_at: new Date().toISOString() };
            const { data, error } = await supabase.from('users').upsert([payload], { returning: 'minimal' });
            if (error) {
              console.warn('Upsert warning after signIn', error);
            } else {
              console.log('Upsert after signIn result', data);
            }
          } catch (err) {
            console.error('Upsert exception after signIn', err);
          }
          localStorage.setItem('userEmail', email);
          showPopup('Signed in successfully!');
          await loadDashboard();
        }
      }
    } catch (err) {
      console.error('Unexpected error in handleAuth', err);
      showPopup('Unexpected error — check console');
    } finally {
      setLoading(false);
    }
  }

  // Google OAuth button
  googleBtn.addEventListener('click', async () => {
    try {
      // Redirect back to the same page after OAuth completes
      const redirectTo = window.location.href; // keep it returning to this page
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo }
      });
      if (error) {
        console.error('Google sign-in error', error);
        showPopup('Google sign-in failed: ' + (error.message || 'see console'));
      } else {
        // Browser will redirect to Google consent screen automatically
        console.log('Redirecting to Google for sign-in...');
      }
    } catch (err) {
      console.error('Google OAuth exception', err);
      showPopup('Google OAuth failed — see console');
    }
  });

  // Load dashboard: shows DB row for current authenticated user
  async function loadDashboard() {
    authSection.classList.add('hidden');
    dashSection.classList.remove('hidden');

    // get session
    try {
      const { data } = await supabase.auth.getSession();
      const session = data?.session ?? null;
      const user = session?.user ?? null;
      const email = user?.email ?? localStorage.getItem('userEmail') ?? 'Unknown';
      welcomeTitle.innerText = `Welcome, ${email.split('@')[0] || email}`;
      emailText.innerText = email;
      userRowPre.innerText = 'Loading user row...';

      // Try to fetch DB row by id first then email (works with trigger/upsert)
      let dbRow = null;
      if (user?.id) {
        const { data: byId, error: idErr } = await supabase.from('users').select('*').eq('id', user.id).limit(1).maybeSingle();
        if (!idErr && byId) dbRow = byId;
      }
      if (!dbRow) {
        const { data: byEmail, error: emErr } = await supabase.from('users').select('*').eq('email', email).limit(1).maybeSingle();
        if (!emErr && byEmail) dbRow = byEmail;
      }
      if (dbRow) userRowPre.innerText = JSON.stringify(dbRow, null, 2);
      else userRowPre.innerText = 'No row found in public.users for this account yet.';
    } catch (err) {
      console.error('Failed to load dashboard', err);
      userRowPre.innerText = 'Error fetching user row (see console).';
    }
  }

  // Sign out
  signOutBtn.addEventListener('click', async () => {
    try {
      await supabase.auth.signOut();
    } catch (err) {
      console.warn('signOut error', err);
    } finally {
      localStorage.removeItem('userEmail');
      dashSection.classList.add('hidden');
      authSection.classList.remove('hidden');
      emailInput.value = '';
      passwordInput.value = '';
      showPopup('Signed out');
    }
  });

  // Listen to auth state changes (e.g., after OAuth redirect)
  supabase.auth.onAuthStateChange((event, session) => {
    console.log('Auth event', event, session);
    if (event === 'SIGNED_IN') {
      // Upsert into public.users (safe fallback) and show dashboard
      (async () => {
        try {
          const user = session?.user;
          if (user?.id) {
            const payload = { id: user.id, email: user.email, created_at: new Date().toISOString() };
            const { data, error } = await supabase.from('users').upsert([payload], { returning: 'minimal' });
            if (error) console.warn('Upsert on SIGNED_IN error', error);
            else console.log('Upsert on SIGNED_IN success', data);
          }
        } catch (err) {
          console.error('Upsert exception in auth listener', err);
        }
        await loadDashboard();
      })();
    } else if (event === 'SIGNED_OUT') {
      localStorage.removeItem('userEmail');
      dashSection.classList.add('hidden');
      authSection.classList.remove('hidden');
    }
  });

  // On load: check session. If signed in show dashboard; else prefill email from localStorage
  (async function init() {
    try {
      const { data } = await supabase.auth.getSession();
      const session = data?.session ?? null;
      if (session && session.user) {
        // If user already signed in (page reload after redirect), load dashboard and upsert if needed
        const user = session.user;
        try {
          const payload = { id: user.id, email: user.email, created_at: new Date().toISOString() };
          const { data: up, error: upErr } = await supabase.from('users').upsert([payload], { returning: 'minimal' });
          if (upErr) console.warn('Upsert init warning', upErr);
          else console.log('Upsert init success', up);
        } catch (err) {
          console.error('Upsert init exception', err);
        }
        localStorage.setItem('userEmail', session.user.email);
        await loadDashboard();
      } else {
        // prefill email if saved
        const saved = localStorage.getItem('userEmail');
        if (saved) emailInput.value = saved;
      }
    } catch (err) {
      console.error('Init error', err);
    }
  })();

</script>
</body>
</html>
